<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  <link rel="apple-touch-icon" href="/favicon-192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cancel Reservation — LeaseWild</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root {
      --color-primary: #2d5a27;
      --color-accent: #c17f3a;
      --color-bg: #f9f6f1;
      --color-surface: #ffffff;
      --color-border: #e4ddd4;
      --color-text: #1a1a18;
      --color-text-muted: #6b6560;
      --font-display: 'Cabinet Grotesk', sans-serif;
      --font-body: 'Satoshi', sans-serif;
      --radius-lg: 14px;
      --radius-full: 999px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 2rem 1.75rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .logo { margin-bottom: 1.5rem; }
    h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; margin-bottom: .5rem; }
    p { font-size: .95rem; color: var(--color-text-muted); line-height: 1.6; }
    .detail-row {
      display: flex; justify-content: space-between;
      font-size: .875rem; padding: .5rem 0;
      border-bottom: 1px solid var(--color-border);
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row strong { color: var(--color-text); }
    .details-box {
      background: #f9f6f1;
      border-radius: 10px;
      padding: 1rem;
      margin: 1.25rem 0;
      text-align: left;
    }
    .policy-box {
      background: #fffbf5;
      border: 1px solid #e8d5b7;
      border-radius: 10px;
      padding: .85rem 1rem;
      margin: 1rem 0;
      font-size: .82rem;
      color: #7a5a2a;
      text-align: left;
      line-height: 1.55;
    }
    .btn-cancel {
      width: 100%; padding: .85rem;
      background: #ef4444; color: #fff;
      border: none; border-radius: var(--radius-full);
      font-family: var(--font-display); font-weight: 800;
      font-size: 1rem; cursor: pointer; margin-top: .75rem;
    }
    .btn-cancel:disabled { opacity: .6; cursor: not-allowed; }
    .btn-back {
      width: 100%; padding: .75rem;
      background: none; color: var(--color-text-muted);
      border: 1.5px solid var(--color-border); border-radius: var(--radius-full);
      font-family: var(--font-display); font-weight: 700;
      font-size: .95rem; cursor: pointer; margin-top: .6rem;
    }
    .msg { margin-top: 1rem; font-size: .9rem; font-weight: 600; }
    .msg.success { color: var(--color-primary); }
    .msg.error { color: #ef4444; }
    #loading { color: var(--color-text-muted); }
  </style>
<link rel="stylesheet" href="/leasewild-theme.css?v=20261111-light"></head>
<body>
  <div class="card">
    <!-- Logo -->
    <div class="logo">
      <svg width="130" height="32" viewBox="0 0 130 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="LeaseWild">
        <polyline points="4,6 10,24 16,10 22,24 28,6" stroke="#c17f3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <ellipse cx="20" cy="7" rx="5" ry="3" fill="#2d5a27" transform="rotate(-30 20 7)"/>
        <text x="36" y="22" font-family="Cabinet Grotesk,sans-serif" font-weight="700" font-size="15" fill="#1a1a18">Lease</text>
        <text x="72" y="22" font-family="Cabinet Grotesk,sans-serif" font-weight="800" font-size="15" fill="#c17f3a">Wild</text>
      </svg>
    </div>

    <div id="loading"><p>Loading your reservation…</p></div>
    <div id="content" style="display:none"></div>
    <div id="done" style="display:none">
      <div style="font-size:3rem;margin-bottom:1rem">✓</div>
      <h1>Reservation Cancelled</h1>
      <p id="done-msg" style="margin-top:.5rem"></p>
      <a href="listings.html" style="display:block;margin-top:1.5rem;color:var(--color-accent);font-weight:700;text-decoration:none">Browse other properties →</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const bookingId=new URLSearchParams(location.search).get('id');
    const api=SUPABASE_URL+'/functions/v1/sandbox-booking-cancel';
    let preview=null;
    async function request(action){
      const {data:{session}}=await sb.auth.getSession();
      if(!session)throw new Error('Please sign in to your hunter account in the Guest Portal before cancelling.');
      const res=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({action,booking_id:bookingId})});
      const data=await res.json();if(!res.ok)throw new Error(data.error||'Cancellation unavailable');return data;
    }
    function safe(v){return String(v??'—').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
    async function init(){
      try{
        if(!bookingId)throw new Error('Missing reservation ID.');
        preview=await request('preview');
        const b=preview.booking;
        const fmt=x=>x?new Date(x+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):'—';
        const msg=preview.refund_type==='release_hold'?'Your card authorization will be released. Your bank may take additional time to remove the hold.':preview.refund_type==='full_refund'?'Under the existing 48-hour flexible policy, your test payment qualifies for a full refund.':'Under the existing 48-hour flexible policy, this booking does not qualify for a refund.';
        document.getElementById('loading').style.display='none';
        const box=document.getElementById('content');box.style.display='block';
        box.innerHTML=`<h1>Cancel Reservation</h1><p style="margin-top:.4rem">Review your reservation and cancellation terms.</p>
          <div class="details-box"><div class="detail-row"><span>Guest</span><strong>${safe(b.guest_name)}</strong></div>
          <div class="detail-row"><span>Check-in</span><strong>${fmt(b.check_in)}</strong></div>
          <div class="detail-row"><span>Check-out</span><strong>${fmt(b.check_out)}</strong></div>
          <div class="detail-row"><span>Nights</span><strong>${safe(b.nights)}</strong></div>
          <div class="detail-row"><span>Booking total</span><strong>$${Number(b.total||0).toFixed(2)}</strong></div></div>
          <div class="policy-box">${safe(msg)}</div>
          <button class="btn-cancel" id="confirm-btn" onclick="confirmCancel()">Yes, cancel my reservation</button>
          <button class="btn-back" onclick="history.back()">Keep my reservation</button>
          <p class="msg" id="cancel-msg" style="display:none"></p>`;
      }catch(e){document.getElementById('loading').innerHTML='<p style="color:#ef4444">'+safe(e.message)+'</p><p><a href="guest-portal.html">Sign in to Guest Portal</a></p>';}
    }
    async function confirmCancel(){
      const btn=document.getElementById('confirm-btn'),msg=document.getElementById('cancel-msg');btn.disabled=true;btn.textContent='Cancelling…';
      try{
        const result=await request('cancel');
        document.getElementById('content').style.display='none';document.getElementById('done').style.display='block';
        document.getElementById('done-msg').textContent=result.result==='authorization_released'?'Your reservation is cancelled. The card hold has been released; bank processing may take longer.':result.result==='full_refund_issued'?'Your reservation is cancelled and a full test refund was initiated.':'Your reservation is cancelled. No refund applies under the existing 48-hour policy.';
      }catch(e){btn.disabled=false;btn.textContent='Yes, cancel my reservation';msg.style.display='block';msg.className='msg error';msg.textContent=e.message;}
    }
    init();
  </script>
</body>
</html>
