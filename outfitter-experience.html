<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outfitter Experience | LeaseWild Sandbox</title><style>:root{font-family:system-ui,sans-serif;color:#243527;background:#f5f1e8}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #ded7c8;padding:18px max(20px,calc((100% - 1050px)/2))}header a{color:#28563b;text-decoration:none;font-weight:800}main{max-width:1050px;margin:30px auto;padding:0 18px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px}.hero{width:100%;max-height:460px;object-fit:cover;border-radius:20px;background:#e7e1d6}.card{background:white;border:1px solid #ded7c8;border-radius:18px;padding:24px;box-shadow:0 8px 28px #1b321009}h1{font-size:clamp(28px,4vw,46px);margin:16px 0}p{line-height:1.6;color:#586052}.eyebrow{color:#aa753a;text-transform:uppercase;font-weight:800;letter-spacing:.1em}button{border:0;background:#28583e;color:white;border-radius:12px;padding:14px 18px;font:inherit;font-weight:700;width:100%;cursor:pointer}button:disabled{background:#87968b;cursor:not-allowed}.price{font-size:28px;font-weight:800}.muted{font-size:14px}#status{margin:20px 0}@media(max-width:750px){.layout{grid-template-columns:1fr}.card{padding:18px}}</style></head><body><header><a href="outfitters.html">← LeaseWild / All Outfitters</a></header><main><p class="eyebrow">Florida guided experiences</p><div id="status">Loading experience…</div><div id="experience" class="layout" hidden><section><img id="photo" class="hero" alt="Outfitter experience photo" hidden><h1 id="title"></h1><p id="location"></p><div class="card"><h2>About this experience</h2><p id="description"></p><h3>Target species</h3><p id="species"></p><h3>Group size</h3><p id="group"></p></div></section><aside><div class="card"><p class="eyebrow">Experience price</p><div class="price" id="price"></div><p id="price-label"></p><button disabled>Online booking coming soon</button><p class="muted">Outfitter reservations and payments aren't available yet. No charge will be made.</p></div></aside></div></main><script>
(async()=>{const el=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');if(!id||!/^[0-9a-f-]{36}$/i.test(id)){el('status').textContent='Invalid experience link.';return}const key='sb_publishable_Q_jURQQCTqad2iY5KXXEew_-s70fPLm';try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);const r=await fetch('https://kbkdfpmlyggfijkyjxoi.supabase.co/rest/v1/outfitter_listings?select=user_id,title,bio,price,price_label,counties,species,photos,max_group_size&status=eq.active&user_id=eq.'+encodeURIComponent(id),{headers:{apikey:key,Accept:'application/json'},signal:controller.signal});clearTimeout(timer);if(!r.ok)throw Error('Unable to retrieve listing');const data=await r.json(),item=data[0];if(!item){el('status').textContent='This experience is unavailable.';return}el('title').textContent=item.title||'Guided experience';el('location').textContent=item.counties||'Florida';el('description').textContent=item.bio||'Contact the outfitter for details.';el('species').textContent=(item.species||[]).join(', ')||'Ask outfitter';el('group').textContent=item.max_group_size?('Up to '+item.max_group_size+' guests'):'Ask outfitter';el('price').textContent=item.price!=null?'$'+Number(item.price).toLocaleString():'Price on request';el('price-label').textContent=item.price_label||'';const photo=Array.isArray(item.photos)?item.photos.find(x=>typeof x==='string'&&x.startsWith('https://')):null;if(photo){el('photo').src=photo;el('photo').hidden=false}el('status').hidden=true;el('experience').hidden=false}catch(e){el('status').textContent='Unable to load this experience. Please try again.'}})();
