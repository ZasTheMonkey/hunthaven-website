<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeaseWild | Listing Reviews</title><style>body{font-family:system-ui,Arial;background:#f5f7f3;color:#183323;margin:0}header{background:#173b2b;color:white;padding:22px 5%}main{max-width:1150px;margin:28px auto;padding:0 18px}section,.panel{background:white;border:1px solid #dbe4dc;border-radius:12px;padding:20px;margin:16px 0}h1{margin:0}input,button{padding:12px;border-radius:8px;border:1px solid #bacbbb;font:inherit}button{background:#205b40;color:white;cursor:pointer;margin:4px}button.secondary{background:#7c3535}button:disabled{opacity:.5;cursor:not-allowed}.controls{display:flex;gap:8px;flex-wrap:wrap}article{border-top:1px solid #e2e9e2;padding:18px 0}.muted{color:#526457}img{width:120px;height:85px;object-fit:cover;border-radius:8px}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #e1e7e2;padding:12px}a{color:#175d42}@media(max-width:700px){table,tbody,tr,td{display:block}thead{display:none}td{padding:5px}tr{border-bottom:1px solid #ddd;padding:12px 0}}</style><link rel="stylesheet" href="/leasewild-theme.css?v=20261111-light"></head><body><header><h1>LeaseWild • Listing Review</h1><p>Sandbox administrator dashboard</p></header><main><div class="panel" id="login"><h2>Founder sign-in</h2><p>Use your verified LeaseWild sandbox account. Only authorized reviewers can access pending listings.</p><div class="controls"><input id="email" type="email" placeholder="Founder email" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="signin">Sign in</button></div></div><div id="dashboard" class="hidden"><div class="controls"><button id="refresh">Refresh pending</button><button id="signout" class="secondary">Sign out</button></div><section><h2>Pending Outfitter listings</h2><div id="outfitters">Loading…</div></section><section><h2>Pending Landowner listings</h2><div id="landowners">Loading…</div></section></div><p id="message" role="status" aria-live="polite"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script>
const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);const message=s=>$('message').textContent=s;const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let pending={outfitter:[],landowner:[]};
async function call(payload){const {data:{session}}=await client.auth.getSession();if(!session)throw Error('Sign in first');const r=await fetch(SUPABASE_URL+'/functions/v1/listing-admin-review',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function render(kind,items){const target=$(kind==='outfitter'?'outfitters':'landowners');target.innerHTML='';if(!items.length){target.textContent='No pending listings.';return}const table=document.createElement('table');table.innerHTML='<thead><tr><th>Listing</th><th>Details</th><th>Submitted</th><th>Decision</th></tr></thead>';const body=document.createElement('tbody');items.forEach(item=>{const id=kind==='outfitter'?item.user_id:item.id;const name=kind==='outfitter'?item.title:[item.first_name,item.last_name].filter(Boolean).join(' ')+' — '+(item.county||'Property');const details=kind==='outfitter'?[item.counties,item.bio].filter(Boolean).join(' • '):[item.county,item.state,item.acreage&&item.acreage+' acres',item.description].filter(Boolean).join(' • ');const tr=document.createElement('tr');tr.innerHTML='<td><strong>'+escapeHtml(name)+'</strong></td><td>'+escapeHtml(details).slice(0,700)+'</td><td>'+escapeHtml(new Date(item.created_at).toLocaleDateString())+'</td><td></td>';const cell=tr.lastElementChild;const approve=document.createElement('button');approve.textContent='Approve';const decline=document.createElement('button');decline.textContent='Decline';decline.className='secondary';for(const [button,decision] of [[approve,'approve'],[decline,'decline']]){button.onclick=async()=>{if(!confirm((decision==='approve'?'Approve':'Decline')+' this '+kind+' listing?'))return;approve.disabled=decline.disabled=true;try{await call({action:'decide',kind,id,decision});message('Listing '+decision+'d.');await load()}catch(e){message(e.message);approve.disabled=decline.disabled=false}};cell.append(button)}body.append(tr)});table.append(body);target.append(table)}
async function load(){try{const data=await call({action:'list'});$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');render('outfitter',data.outfitters||[]);render('landowner',data.landowners||[]);message('Pending listings refreshed.')}catch(e){message(e.message)}}
$('signin').onclick=async()=>{message('Signing in…');const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){message(error.message);return}await load()};$('refresh').onclick=load;$('signout').onclick=async()=>{await client.auth.signOut();$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');message('Signed out.')};client.auth.getSession().then(({data})=>{if(data.session)load()});
</script></body></html>
