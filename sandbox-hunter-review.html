<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Review a hunter — LeaseWild sandbox</title><style>body{margin:0;background:#f5f1e8;color:#1d3023;font:16px system-ui}header{background:#23452c;color:white;padding:1.2rem}main{max-width:650px;margin:1.5rem auto;background:white;border-radius:16px;padding:clamp(1rem,4vw,2rem)}label{display:block;margin:1rem 0 .3rem;font-weight:650}select,textarea,button{font:inherit;padding:.7rem;width:100%;box-sizing:border-box;border-radius:8px;border:1px solid #aaa}button{margin-top:1.3rem;background:#285632;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}textarea{min-height:110px}a{color:inherit}</style><link rel="stylesheet" href="/leasewild-light-system.css?v=20261112-canonical"></head><body><header><a href="landowner-portal.html">← Landowner portal</a><h1>Review your hunter</h1><p>Sandbox only · After a completed, paid stay</p></header><main><p id="status" role="status" aria-live="polite">Checking booking eligibility…</p><form id="review-form" hidden><label for="overall">Overall rating</label><select id="overall" required><option value="">Choose a rating</option><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Fair</option><option value="2">2 — Poor</option><option value="1">1 — Very poor</option></select><label for="communication">Communication</label><select id="communication"><option value="">Not rated</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select><label for="safety">Safety</label><select id="safety"><option value="">Not rated</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select><label for="respect">Property respect</label><select id="respect"><option value="">Not rated</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select><label for="feedback">Written feedback</label><textarea id="feedback" maxlength="2000" placeholder="Describe the experience without sharing private details."></textarea><button id="submit">Submit for moderation</button></form><p>Reviews are submitted for moderation and cannot be edited here. Please avoid personal contact details or sensitive information.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-config.js"></script><script>
(async function(){
const booking=new URLSearchParams(location.search).get('booking'),status=document.getElementById('status'),form=document.getElementById('review-form');
if(!booking||!/^[0-9a-f-]{36}$/i.test(booking)){status.textContent='A valid booking ID is required.';return;}
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),{data:{user}}=await sb.auth.getUser();if(!user){status.textContent='Sign in to the landowner portal first.';return;}
const {data:payments,error}=await sb.from('lease_payments').select('booking_id,guest_id,owner_id,checkout_at,payment_state,state').eq('booking_id',booking).eq('owner_id',user.id).limit(1);
if(error){status.textContent='Cannot verify booking eligibility. '+error.message;return;}
const p=payments&&payments[0];
if(!p||p.payment_state!=='paid'||new Date(p.checkout_at)>new Date()||['cancelled','canceled','refunded','refund_pending','disputed','failed'].includes(p.state)){status.textContent='This booking is not eligible for a review.';return;}
const {data:existing}=await sb.from('hunter_reviews').select('id').eq('booking_id',booking).limit(1);
if(existing&&existing.length){status.textContent='You already reviewed this booking.';return;}
status.textContent='Eligible payment found. Final eligibility is checked securely when submitted.';form.hidden=false;
form.onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('submit');btn.disabled=true;status.textContent='Submitting…';
const rating=id=>{const v=document.getElementById(id).value;return v?Number(v):null;};
const {error:err}=await sb.from('hunter_reviews').insert({booking_id:booking,reviewer_owner_id:user.id,hunter_id:p.guest_id,overall_rating:rating('overall'),communication_rating:rating('communication'),safety_rating:rating('safety'),property_respect_rating:rating('respect'),review_text:document.getElementById('feedback').value.trim()||null});
if(err){status.textContent='Review not submitted: '+err.message;btn.disabled=false;}else{status.textContent='Review submitted for moderation.';form.hidden=true;}
};
})();
</script></body></html>
