<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Reset Password — LeaseWild Sandbox</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#1d1e1c;color:#f4f4ef;font:17px system-ui,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,460px);background:#30312f;border:1px solid #555953;border-radius:22px;padding:clamp(24px,5vw,42px)}
.flag{background:#8d761c;color:#fff4c2;padding:12px;font-weight:700;text-align:center;margin-bottom:25px;font-size:13px}
h1{font-size:30px;margin:0 0 12px}p{line-height:1.5;color:#c5ccc4}label{display:block;margin:24px 0 8px;font-weight:600}
input{width:100%;padding:15px;border:1px solid #6c726b;background:#252624;color:#fff;border-radius:10px;font-size:17px}
button{width:100%;padding:16px;margin-top:22px;border:0;border-radius:10px;background:#d2f5e8;color:#172c25;font-weight:800;font-size:17px;cursor:pointer}
button:disabled{opacity:.6}a{color:#d2f5e8}#status{margin-top:18px;white-space:pre-wrap}#status.error{color:#ffb6b0}#status.success{color:#b8e9c3}
[hidden]{display:none!important}.back{display:block;margin-top:24px;text-align:center}
</style></head>
<body><main><div class="flag">LEASEWILD SANDBOX — TEST DATA ONLY</div>
<section id="request"><h1>Forgot your password?</h1><p>Enter your email address and we'll send a secure link to reset your password.</p>
<form id="request-form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
<button type="submit" id="send">Send reset link</button></form></section>
<section id="change" hidden><h1>Set a new password</h1><p>Choose a new password for your LeaseWild account.</p>
<form id="change-form"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required>
<label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
<button type="submit" id="save">Update password</button></form></section>
<div id="status" role="status" aria-live="polite"></div><a class="back" id="back" href="guest-portal.html">Back to Hunter Portal</a></main>
<script>
(function(){
const params=new URLSearchParams(location.search);
const role=params.get('role')==='landowner'?'landowner':'hunter';
const portal=role==='landowner'?'landowner-portal.html':'guest-portal.html';
document.getElementById('back').href=portal;
const sb=supabase.createClient('https://kbkdfpmlyggfijkyjxoi.supabase.co','sb_publishable_Q_jURQQCTqad2iY5KXXEew_-s70fPLm',{auth:{detectSessionInUrl:true}});
const status=document.getElementById('status');
const request=document.getElementById('request'),change=document.getElementById('change');
const recoveryHint=params.has('code')||params.get('type')==='recovery'||location.hash.includes('type=recovery')||location.hash.includes('access_token=');
function message(t,error){status.textContent=t;status.className=error?'error':'success'}
function showChange(){request.hidden=true;change.hidden=false;message('',false)}
if(recoveryHint)showChange();
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showChange()});
document.getElementById('request-form').addEventListener('submit',async e=>{
e.preventDefault();const button=document.getElementById('send');button.disabled=true;message('',false);
try{const email=document.getElementById('email').value.trim();const redirectTo=location.origin+'/reset-password.html?role='+role;
const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});
if(error)throw error;
message('If an account exists for this email, you will receive a password-reset link. Check Spam too.',false);
}catch(err){message(err.message||'Unable to send reset email. Try again.',true)}finally{button.disabled=false}
});
document.getElementById('change-form').addEventListener('submit',async e=>{
e.preventDefault();const button=document.getElementById('save'),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;
if(password!==confirm){message('Passwords do not match.',true);return}
if(password.length<8){message('Use at least 8 characters.',true);return}
button.disabled=true;try{const {data:{session},error:sessionError}=await sb.auth.getSession();
if(sessionError||!session)throw new Error('This reset link is invalid or expired. Request a new link.');
const {error}=await sb.auth.updateUser({password});if(error)throw error;
await sb.auth.signOut();document.getElementById('change-form').hidden=true;
message('Password updated successfully. Return to the portal and sign in with your new password.',false);
}catch(err){message(err.message||'Could not update password.',true)}finally{button.disabled=false}
});
})();
</script></body></html>
